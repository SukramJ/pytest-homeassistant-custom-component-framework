name: Automatic Generate

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  generate_package:
    runs-on: "ubuntu-latest"
    outputs:
      current_ha_version: ${{ steps.current-ha-version.outputs.current-ha-version }}
      new_ha_version: ${{ steps.new-ha-version.outputs.new-ha-version }}
      need_to_release: ${{ steps.need-to-release.outputs.need-to-release }}
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
      - name: store current ha version
        id: current-ha-version
        run: echo "current-ha-version=$(cat ha_version)" >> $GITHUB_OUTPUT
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: install dependencies
        run: pip install -r requirements_generate.txt
      - name: Install phacc for current versions
        run: pip install -e .
      - name: execute generate package
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python generate_phacc/generate_phacc.py
      - name: store new ha version
        id: new-ha-version
        run: echo "new-ha-version=$(cat ha_version)" >> $GITHUB_OUTPUT
      - name: check need to release
        id: need-to-release
        run: |
          if [[ "${{ steps.current-ha-version.outputs.current-ha-version}}" == "${{ steps.new-ha-version.outputs.new-ha-version }}" ]]; then
            echo "need-to-release=false" >> $GITHUB_OUTPUT
          else
            echo "need-to-release=true" >> $GITHUB_OUTPUT
          fi
      - name: list files
        run: ls -a
      - name: publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: generated-package
          path: |
            ./
            !**/*.pyc
            !tmp_dir/
            !.git/
          if-no-files-found: error
  test:
    needs: generate_package
    runs-on: "ubuntu-latest"
    if: needs.generate_package.outputs.need_to_release == 'true'
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: generated-package
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Test with pytest
        run: |
          pytest
  make_release:
    needs: [generate_package, test]
    runs-on: "ubuntu-latest"
    if: needs.generate_package.outputs.need_to_release == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: generated-package
      - name: need_to_release_print
        run: "echo ${{ needs.generate_package.outputs.need_to_release }}"
      - name: Calculate next version
        id: next_version
        env:
          GH_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
          BUMP: patch
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "unknown bump type: $BUMP" >&2; exit 1 ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> $GITHUB_OUTPUT
          echo "latest tag: ${latest} -> next version: ${major}.${minor}.${patch}"
      - run: echo "${{ steps.next_version.outputs.version }}" > version
      - run: echo "${{ steps.next_version.outputs.version }}"
      - id: git_commit
        run: |
          git config user.name 'SukramJ'
          git config user.email 'SukramJ@users.noreply.github.com'
          git add .
          git commit -m "Bump version"
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.REPO_SCOPED_TOKEN }}
          tag_name: ${{ steps.next_version.outputs.version }}
          target_commitish: ${{ steps.git_commit.outputs.sha }}
          name: Release ${{ steps.next_version.outputs.version }}
          body: |
            Automatic release
            homeassistant version: ${{ needs.generate_package.outputs.new_ha_version }}
          draft: false
          prerelease: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build
        run: |
          python -m build
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
